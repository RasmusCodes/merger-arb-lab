[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merger-arb-lab"
version = "0.1.0"
description = "Merger-arbitrage research, risk and manually-approved IBKR execution tooling (first case: Marvell / Lumentum)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
report = ["matplotlib>=3.8"]
ibkr = ["ib_async>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mergerarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
